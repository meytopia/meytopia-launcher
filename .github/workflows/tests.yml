# Meytopia launcher — filet de tests (anti-régression)
# À chaque push/PR : syntaxe du renderer + tests des fonctions pures de la page Communauté
# (sources de données, exclusion des joueurs privés, jalons, sessions, formats, pouls).
# Croix rouge AVANT qu'une release ne parte chez les joueurs.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe du renderer + processus principal
        run: |
          node --check src/renderer/js/app.js
          node --check src/main/sync.js
          node --check src/main/downloads.js
          node --check src/main/game.js
          node --check src/main/accounts.js
          node --check src/main/updater.js
          node --check src/main/main.js
      - name: Tests fonctions pures (page Communauté)
        run: node tools/launcher-test.js
      - name: Tests processus principal (synchro, comptes)
        run: node tools/main-test.js
      - name: Tests connexion serveur (adresse SRV, servers.dat)
        run: node tools/servers-test.js
